<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">personal-context 证据与记忆流水线</title>
  <desc id="desc">文件进入不可变 Source，经过带时间的 Segment 和类型化提取形成 CandidateMemory，在用户明确审核后才能成为 Memory；Wiki 和搜索索引均可重建，查询结论必须引用来源。</desc>

  <rect width="1200" height="570" rx="26" fill="#f4f1e9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="54" y="52" fill="#152333" font-size="13" font-weight="700" letter-spacing="2">EVIDENCE → REVIEW → MEMORY</text>
    <text x="54" y="93" fill="#0b1220" font-size="35" font-weight="760">采集不等于长期记忆</text>
    <text x="54" y="123" fill="#526275" font-size="16">任何重要结论，都能沿证据链回到原始 Source 与具体时间片段。</text>

    <g transform="translate(54 169)">
      <path d="M146 94H195M339 94H388M532 94H581M725 94H774M918 94H967" stroke="#8b9bab" stroke-width="2"/>
      <path d="M188 88L198 94L188 100M381 88L391 94L381 100M574 88L584 94L574 100M767 88L777 94L767 100M960 88L970 94L960 100" fill="none" stroke="#526275" stroke-width="2"/>

      <g>
        <rect width="146" height="188" rx="16" fill="#102536"/>
        <text x="18" y="29" fill="#5dd8c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">01 / CAPTURE</text>
        <path d="M28 57H118V127H28Z" fill="#17374a" stroke="#5dd8c6"/>
        <path d="M43 77H103M43 91H92M43 105H101" stroke="#bdf4eb" stroke-opacity=".6"/>
        <text x="73" y="153" text-anchor="middle" fill="#f2f6f7" font-size="16" font-weight="700">Source</text>
        <text x="73" y="173" text-anchor="middle" fill="#8ea0b8" font-size="11">SHA-256 · immutable</text>
      </g>

      <g transform="translate(195)">
        <rect width="144" height="188" rx="16" fill="#ffffff" stroke="#d4d9db"/>
        <text x="18" y="29" fill="#526275" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">02 / OBSERVE</text>
        <rect x="22" y="54" width="100" height="72" rx="9" fill="#eaf0f2"/>
        <text x="34" y="76" fill="#526275" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">00:00—00:04</text>
        <path d="M34 91H111M34 104H100" stroke="#8b9bab"/>
        <text x="72" y="153" text-anchor="middle" fill="#152333" font-size="16" font-weight="700">Event + Segment</text>
        <text x="72" y="173" text-anchor="middle" fill="#6c7a88" font-size="11">speaker · observed_at</text>
      </g>

      <g transform="translate(388)">
        <rect width="144" height="188" rx="16" fill="#ffffff" stroke="#d4d9db"/>
        <text x="18" y="29" fill="#526275" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">03 / TYPE</text>
        <g font-size="10" font-weight="700">
          <rect x="20" y="54" width="47" height="24" rx="12" fill="#dcefe9"/><text x="43.5" y="70" text-anchor="middle" fill="#276657">CLAIM</text>
          <rect x="76" y="54" width="48" height="24" rx="12" fill="#e7e9ec"/><text x="100" y="70" text-anchor="middle" fill="#526275">FACT</text>
          <rect x="20" y="87" width="59" height="24" rx="12" fill="#eee4cc"/><text x="49.5" y="103" text-anchor="middle" fill="#75591c">DECISION</text>
          <rect x="87" y="87" width="37" height="24" rx="12" fill="#e4e1ef"/><text x="105.5" y="103" text-anchor="middle" fill="#5e4e85">ACTION</text>
        </g>
        <text x="72" y="153" text-anchor="middle" fill="#152333" font-size="16" font-weight="700">Typed records</text>
        <text x="72" y="173" text-anchor="middle" fill="#6c7a88" font-size="11">said ≠ true</text>
      </g>

      <g transform="translate(581)">
        <rect width="144" height="188" rx="16" fill="#fff8e8" stroke="#d8bd72"/>
        <text x="18" y="29" fill="#846928" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">04 / PROPOSE</text>
        <rect x="22" y="54" width="100" height="72" rx="9" fill="#f6e8bb"/>
        <path d="M36 76H108M36 91H98M36 106H104" stroke="#9b7d34"/>
        <circle cx="108" cy="113" r="9" fill="#f5c56b"/>
        <text x="72" y="153" text-anchor="middle" fill="#493a17" font-size="16" font-weight="700">CandidateMemory</text>
        <text x="72" y="173" text-anchor="middle" fill="#846928" font-size="11">status: pending</text>
      </g>

      <g transform="translate(774)">
        <rect width="144" height="188" rx="16" fill="#172131"/>
        <text x="18" y="29" fill="#f5c56b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">05 / REVIEW</text>
        <circle cx="72" cy="89" r="34" fill="#2b2a24" stroke="#f5c56b"/>
        <path d="M57 89L68 100L89 76" fill="none" stroke="#f5c56b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="72" y="153" text-anchor="middle" fill="#f2f6f7" font-size="16" font-weight="700">User gate</text>
        <text x="72" y="173" text-anchor="middle" fill="#b9a57d" font-size="11">approve / reject</text>
      </g>

      <g transform="translate(967)">
        <rect width="146" height="188" rx="16" fill="#dcefe9" stroke="#57a793"/>
        <text x="18" y="29" fill="#276657" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">06 / REMEMBER</text>
        <path d="M28 55H118V126H28Z" fill="#f5fbf9" stroke="#57a793"/>
        <path d="M42 76H104M42 90H92M42 104H100" stroke="#57a793"/>
        <path d="M104 114L114 124" stroke="#276657" stroke-width="2"/>
        <text x="73" y="153" text-anchor="middle" fill="#193f36" font-size="16" font-weight="700">Memory</text>
        <text x="73" y="173" text-anchor="middle" fill="#48796d" font-size="11">approved + cited</text>
      </g>
    </g>

    <g transform="translate(54 399)">
      <rect width="1092" height="116" rx="16" fill="#e8e5dd"/>
      <text x="24" y="31" fill="#526275" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">COMPILED VIEWS — DELETABLE &amp; REBUILDABLE</text>
      <g transform="translate(24 49)">
        <rect width="164" height="44" rx="9" fill="#fff"/><text x="82" y="27" text-anchor="middle" fill="#152333" font-size="13" font-weight="700">Wiki Markdown</text>
        <rect x="180" width="164" height="44" rx="9" fill="#fff"/><text x="262" y="27" text-anchor="middle" fill="#152333" font-size="13" font-weight="700">Search Index</text>
        <rect x="360" width="244" height="44" rx="9" fill="#102536"/><text x="482" y="27" text-anchor="middle" fill="#bdf4eb" font-size="13" font-weight="700">Retrieve + Source citation</text>
        <path d="M620 22H740" stroke="#526275" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="760" y="27" fill="#526275" font-size="13">权威数据仍是 SQLite + Source</text>
      </g>
    </g>
  </g>
</svg>
