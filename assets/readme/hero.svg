<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">personal-context — 证据先于记忆</title>
  <desc id="desc">一个本地优先的 Codex Skill，将不可变来源、带时间的证据、候选记忆和用户审核连接成可追溯的个人上下文系统。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2c"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <pattern id="ledger" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ea0b8" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#paper)"/>
  <rect width="1200" height="420" rx="28" fill="url(#ledger)"/>
  <path d="M55 58H1145" stroke="#8ea0b8" stroke-opacity=".24"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="42" fill="#8ea0b8" font-size="13" font-weight="650" letter-spacing="2.2">CODEX SKILL  ·  LOCAL FIRST  ·  SCHEMA 1</text>

    <text x="56" y="132" fill="#f2f6f7" font-size="65" font-weight="760" letter-spacing="-2.4">personal-context</text>
    <text x="58" y="177" fill="#5dd8c6" font-size="25" font-weight="650">证据先于记忆。</text>
    <text x="58" y="211" fill="#c7d2df" font-size="20">采集、审核、检索，并让每个结论回到来源。</text>

    <g transform="translate(58 263)">
      <rect width="145" height="34" rx="17" fill="#162b35" stroke="#5dd8c6" stroke-opacity=".7"/>
      <text x="72.5" y="22" text-anchor="middle" fill="#bdf4eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">14 COMMANDS</text>
      <rect x="157" width="118" height="34" rx="17" fill="#2b2517" stroke="#f5c56b" stroke-opacity=".7"/>
      <text x="216" y="22" text-anchor="middle" fill="#ffe3a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">10 TESTS</text>
      <rect x="287" width="126" height="34" rx="17" fill="#171f2d" stroke="#8ea0b8" stroke-opacity=".55"/>
      <text x="350" y="22" text-anchor="middle" fill="#c7d2df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">NO CLOUD</text>
    </g>

    <g transform="translate(58 339)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <circle cx="5" cy="-4" r="5" fill="#5dd8c6"/>
      <text x="20" y="1" fill="#8ea0b8" font-size="13">Source SHA-256</text>
      <path d="M143 -4H188" stroke="#8ea0b8" stroke-opacity=".5"/>
      <circle cx="198" cy="-4" r="5" fill="#f5c56b"/>
      <text x="213" y="1" fill="#8ea0b8" font-size="13">explicit approval</text>
      <path d="M355 -4H400" stroke="#8ea0b8" stroke-opacity=".5"/>
      <circle cx="410" cy="-4" r="5" fill="#f2f6f7"/>
      <text x="425" y="1" fill="#8ea0b8" font-size="13">cited retrieval</text>
    </g>

    <g transform="translate(650 92) scale(.83)">
      <path d="M30 112H96M226 112H292M422 112H468" fill="none" stroke="#8ea0b8" stroke-width="2" stroke-opacity=".55"/>
      <path d="M89 106L99 112L89 118M285 106L295 112L285 118M461 106L471 112L461 118" fill="none" stroke="#8ea0b8" stroke-width="2"/>

      <g>
        <rect x="0" y="45" width="96" height="134" rx="14" fill="#122737" stroke="#5dd8c6"/>
        <path d="M17 70H79M17 84H62M17 142H79M17 155H67" stroke="#5dd8c6" stroke-opacity=".55"/>
        <rect x="17" y="101" width="62" height="25" rx="5" fill="#0b1220"/>
        <text x="48" y="118" text-anchor="middle" fill="#bdf4eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">sha256</text>
        <text x="48" y="27" text-anchor="middle" fill="#c7d2df" font-size="13" font-weight="700">SOURCE</text>
        <text x="48" y="199" text-anchor="middle" fill="#8ea0b8" font-size="11">immutable</text>
      </g>

      <g>
        <rect x="98" y="25" width="128" height="174" rx="16" fill="#151f2d" stroke="#8ea0b8" stroke-opacity=".65"/>
        <text x="116" y="52" fill="#8ea0b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">00:00—00:04</text>
        <text x="116" y="81" fill="#f2f6f7" font-size="13">“我们周五发布”</text>
        <rect x="116" y="99" width="63" height="23" rx="11.5" fill="#243346"/>
        <text x="147.5" y="115" text-anchor="middle" fill="#c7d2df" font-size="10" font-weight="700">CLAIM</text>
        <path d="M116 142H207M116 156H194M116 170H202" stroke="#8ea0b8" stroke-opacity=".32"/>
        <text x="162" y="220" text-anchor="middle" fill="#8ea0b8" font-size="11">segment + time</text>
      </g>

      <g>
        <rect x="294" y="45" width="128" height="134" rx="16" fill="#2b2517" stroke="#f5c56b"/>
        <circle cx="358" cy="90" r="22" fill="#f5c56b" fill-opacity=".12" stroke="#f5c56b"/>
        <path d="M348 90L355 97L369 81" fill="none" stroke="#f5c56b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="358" y="135" text-anchor="middle" fill="#ffe3a9" font-size="13" font-weight="700">USER REVIEW</text>
        <text x="358" y="155" text-anchor="middle" fill="#b9a57d" font-size="10">approve / reject</text>
        <text x="358" y="199" text-anchor="middle" fill="#8ea0b8" font-size="11">explicit gate</text>
      </g>

      <g>
        <rect x="470" y="25" width="136" height="174" rx="16" fill="#eef4f6"/>
        <text x="488" y="54" fill="#526275" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">MEMORY / DECISION</text>
        <path d="M488 76H588M488 91H572" stroke="#0b1220" stroke-opacity=".55"/>
        <rect x="488" y="114" width="100" height="48" rx="8" fill="#d9e5e8"/>
        <text x="499" y="133" fill="#526275" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">source: src_470…</text>
        <text x="499" y="150" fill="#526275" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">segment: 0—4200ms</text>
        <text x="538" y="220" text-anchor="middle" fill="#8ea0b8" font-size="11">memory + citation</text>
      </g>

      <path d="M358 240V273H538V240" fill="none" stroke="#5dd8c6" stroke-width="2" stroke-dasharray="5 6"/>
      <text x="448" y="294" text-anchor="middle" fill="#5dd8c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">AUDITABLE EVIDENCE CHAIN</text>
    </g>
  </g>
</svg>
